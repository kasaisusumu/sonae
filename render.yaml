# Render Blueprint — そなえ（Web サービス + 定期ポーリング Cron）
# 使い方: このリポジトリを GitHub に push し、Render で "New +" → "Blueprint" → このリポジトリを選択。
# デプロイ後、下の sync:false の環境変数を Render ダッシュボードで設定してください。

services:
  # ── Web 本体 ──
  - type: web
    name: sonae
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # 永続ディスクには有料プラン（$7/月〜）が必要
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: sonae-data
      mountPath: /data       # SQLite をここに置く
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/data/prod.db
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        sync: false           # 下の cron と同じ値を設定
      - key: APP_BASE_URL
        sync: false            # 例: https://sonae.onrender.com（初回デプロイ後に確定）
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false            # 例: https://sonae.onrender.com/api/auth/google/callback
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false            # 例: mailto:you@example.com

  # ── 新規予定の定期ポーリング（5分おき）──
  # Web サービスの /api/cron/poll を叩くだけ。Node ランタイムで軽量に実行。
  - type: cron
    name: sonae-poll
    runtime: node
    buildCommand: node --version
    startCommand: node scripts/poll-trigger.mjs
    schedule: "*/5 * * * *"
    envVars:
      - key: APP_BASE_URL
        sync: false            # Web と同じ値
      - key: CRON_SECRET
        sync: false            # Web と同じ値
